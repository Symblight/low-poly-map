# simworld Cargo workspace (spec-library-packaging.md, section 2):
#   simworld-core  - pure Rust world (no godot): tile math, cover, fetch/cache, decode, meshing,
#                    lights, ground, floating origin (`World`), `Log` + `Diagnostics`. rlib.
#   simworld-godot - gdext binding: the `WorldStreamer` node only (type conversion). cdylib + staticlib,
#                    builds target/{debug,release}/libsimworld_godot.* loaded by the .gdextension.
#   simworld-cli   - headless runner (placeholder until P6).
[workspace]
resolver = "2"
members = ["simworld-core", "simworld-godot", "simworld-cli"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.94"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

# The editor loads the debug dylib: optimize dependencies (decode, HTTP, gdext glue) and lightly
# optimize the workspace crates so debug builds stay usable within the per-frame budgets. Debug info stays.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
