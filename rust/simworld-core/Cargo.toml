[package]
name = "simworld-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "SimWorld core: streamed low-poly OSM world (tiles, LOD cover, fetch, meshing, lights, floating origin). Engine-free."

# Plain rlib. No godot, no OpenSSL, no desktop-only crates (iOS static builds link it through
# simworld-godot's staticlib).
[lib]
name = "simworld_core"

[dependencies]
# I/O: tokio runtime + reqwest (rustls only, no OpenSSL; plain http:// works too).
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# PMTiles v3 reader over HTTP range requests (no mmap / s3 defaults).
pmtiles = { version = "0.25.0", default-features = false, features = ["http-async", "reqwest-rustls"] }
bytes = "1.12"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Disk tile cache: one SQLite file per source (docs/spec-tile-cache.md). `bundled` compiles the
# SQLite amalgamation with `cc`: no system library, works for iOS static builds. `cache` (pure
# Rust) gives `prepare_cached`, so the cache thread prepares each statement once.
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "cache"] }

# Decode / CPU work.
mvt-reader = "2.5.0"
geo-types = { version = "0.7", default-features = false }
earcutr = "0.5.0"
crossbeam-channel = "0.5.17"

# World profile (JSON): pure Rust, no native deps. `float_roundtrip` parses decimal values to the
# exact nearest f64, so a JSON profile reproduces the compiled-in defaults bit for bit.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

# Transcendentals (sin, cos, ln, atan2, hypot ...) through pure-Rust libm: bit-identical on every
# platform, unlike the platform maths library behind f64::sin (src/math.rs, spec-world-seed 7).
libm = "0.2.16"

# Containers / hashing.
ahash = "0.8.12"

# Profiling only (Diagnostics::profile): per-thread CPU time to tell work from preemption.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tests only: write small .pmtiles fixtures (served by a test HTTP server). Dev-dependency
# features are not unified into normal builds (resolver 2).
[dev-dependencies]
pmtiles = { version = "0.25.0", default-features = false, features = ["write"] }

# Disk cache benchmark, old file-per-tile cache vs SQLite (docs/spec-tile-cache.md): plain `main`,
# no bench framework. `cargo bench -p simworld-core --bench cache_bench` (needs data/out/vilnius.pmtiles).
[[bench]]
name = "cache_bench"
harness = false
